services:
  # MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: inventory-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-inventory_billing}
      MYSQL_USER: ${DB_USERNAME:-inv_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-localdevpassword}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootdevpassword}
    ports:
      # Host port 3307 avoids conflicts with any pre-existing local MySQL on 3306
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootdevpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Spring Boot Backend API Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-inventory_billing}
      DB_USERNAME: ${DB_USERNAME:-inv_app}
      DB_PASSWORD: ${DB_PASSWORD:-localdevpassword}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
