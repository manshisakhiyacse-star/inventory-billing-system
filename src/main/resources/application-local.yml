# =========================================================
# Local development profile
# =========================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inventory_billing}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:inv_app}
    password: ${DB_PASSWORD:localdevpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

# Show more details locally for debugging
server:
  error:
    include-message: always
    include-binding-errors: always

# Swagger enabled locally
springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.inventory.system: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
