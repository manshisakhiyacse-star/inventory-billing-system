# =========================================================
# Common configuration (shared by all profiles)
# =========================================================
spring:
  application:
    name: inventory-billing-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA / Hibernate
  jpa:
    open-in-view: false                    # Disable lazy-loading in controllers (performance best practice)
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: validate                   # Production safety: Flyway manages schema; Hibernate only validates

  # Flyway database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Jackson JSON
  jackson:
    default-property-inclusion: non_null   # Don't serialize null fields
    serialization:
      write-dates-as-timestamps: false     # ISO-8601 date format

  # Request size limits
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# Server
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 2MB
  error:
    include-message: never                 # Don't leak error details in production
    include-stacktrace: never
    include-binding-errors: never

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized         # Only authenticated users see full health details
  info:
    env:
      enabled: true

# JWT configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    issuer: inventory-billing-system

# CORS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# SpringDoc / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
